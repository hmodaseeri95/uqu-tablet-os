<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="UQU Tablet OS نموذج لوحي لطلاب جامعة أم القرى: ترحيب، جدول قابل للتعديل، ومهام تصل من الدكتور مباشرة.">
  <meta name="theme-color" content="#0f766e">
  <meta property="og:title" content="UQU Tablet OS">
  <meta property="og:description" content="نموذج لوحي لتنظيم يوم الطالب في جامعة أم القرى.">
  <meta property="og:locale" content="ar_SA">
  <title>UQU Tablet OS | جامعة أم القرى</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f766e'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='Arial' font-size='15' font-weight='700' fill='white'%3EU%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    try {
      var savedBoot = JSON.parse(localStorage.getItem("uqu-tablet-os-v2") || "null");
      if (savedBoot && savedBoot.profile && savedBoot.profile.onboarded) {
        document.documentElement.classList.add("is-ready");
      }
    } catch (err) {}
  </script>
</head>
<body>
  <div class="desk">
    <div class="tablet">
      <span class="tablet__camera" aria-hidden="true"></span>
      <span class="tablet__button tablet__button--up" aria-hidden="true"></span>
      <span class="tablet__button tablet__button--down" aria-hidden="true"></span>
      <span class="tablet__power" aria-hidden="true"></span>

      <div class="screen">
        <div class="statusbar">
          <time id="clock">--:--</time>
          <button class="statusbar__center" id="shade-toggle" type="button">متصل</button>
          <span class="statusbar__icons">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor" d="M12 18.5a1.5 1.5 0 1 0 .001 3.001A1.5 1.5 0 0 0 12 18.5Zm-4.24-3.05 1.42 1.41a3.9 3.9 0 0 1 5.64 0l1.42-1.41a5.9 5.9 0 0 0-8.48 0Zm-2.83-2.82 1.41 1.41a7.9 7.9 0 0 1 11.32 0l1.41-1.41a9.9 9.9 0 0 0-14.14 0Z"/>
            </svg>
            <span class="battery" aria-label="البطارية 86 بالمئة"><span></span></span>
          </span>
        </div>

        <header class="topbar">
          <button class="user" id="open-profile" type="button">
            <span class="avatar" id="avatar" aria-hidden="true">م</span>
            <span class="user__text">
              <span id="hello-name">أهلاً</span>
              <span id="hello-id">الرقم الجامعي</span>
            </span>
          </button>
          <div class="brand">
            <h1>UQU Tablet OS</h1>
            <p>جامعة أم القرى</p>
          </div>
          <time id="today-date" class="date">اليوم</time>
        </header>

        <div class="shade" id="shade" hidden>
          <div class="shade__head">
            <strong>التنبيهات</strong>
            <button type="button" id="shade-close">إغلاق</button>
          </div>
          <div id="shade-list"></div>
        </div>

        <div class="toast-wrap" id="toasts" aria-live="polite"></div>

        <main class="stage" id="stage"></main>

        <nav class="dock" aria-label="تطبيقات التابلت">
          <button class="dock__btn" type="button" data-view="home" aria-current="page">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.5Z"/></svg>
            <span>اليوم</span>
          </button>
          <button class="dock__btn" type="button" data-view="schedule">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 2h2v2h6V2h2v2h3v18H4V4h3V2Zm11 8H6v10h12V10Z"/></svg>
            <span>الجدول</span>
          </button>
          <button class="dock__btn" type="button" data-view="tasks">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 5h16v3H4V5Zm0 5.5h16v3H4v-3ZM4 16h10v3H4v-3Z"/></svg>
            <span>المهام</span>
          </button>
          <button class="dock__btn" type="button" data-view="inbox">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 5h16v10H7l-3 3V5Z"/></svg>
            <span>الرسائل</span>
            <i class="dock__badge" id="unread-badge" hidden>0</i>
          </button>
          <button class="dock__btn" type="button" data-view="profile">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4Zm0 2c-4 0-7 2-7 4v2h14v-2c0-2-3-4-7-4Z"/></svg>
            <span>حسابي</span>
          </button>
        </nav>

        <section class="welcome" id="welcome" aria-label="الترحيب">
          <div class="hello" id="hello">
            <p class="hello-kicker">UQU Tablet OS</p>
            <h2 class="hello-word">مرحبا</h2>
            <p class="hello-sub">جامعة أم القرى</p>
          </div>
          <form class="ask" id="ask" hidden>
            <p class="ask-progress" id="ask-progress">1 من 3</p>
            <h2 id="ask-title">وش اسمك؟</h2>
            <p class="ask-note" id="ask-note">الاسم يظهر في شريط التابلت، وتقدر تعدّله بعدين.</p>
            <input class="ask-input" id="ask-input" name="answer" autocomplete="name">
            <div class="swatches" id="ask-swatches" hidden></div>
            <label class="color-line" id="ask-color-line" hidden>
              <span>أو اختر لون أدق</span>
              <input type="color" id="ask-color" value="#0f766e">
            </label>
            <p class="ask-error" id="ask-error" role="alert"></p>
            <button class="ask-next" id="ask-next" type="submit">التالي</button>
          </form>
        </section>
      </div>
    </div>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
